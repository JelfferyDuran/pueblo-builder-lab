server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # No caching so the app always serves fresh (dev-friendly)
    add_header Cache-Control "no-store";

    # Gzip static assets for mobile speed
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Asset caching: hashed/versioned files can live longer, but keep small for a school project
    location /pueblo-assets/ {
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
